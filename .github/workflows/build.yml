name: Build Flutter APK

on:
  push:
    branches:
      - main # Jalankan workflow setiap kali melakukan push ke branch main
  workflow_dispatch: # Memungkinkan Anda menjalankan build secara manual dari web GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout kode dari repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java JDK di server GitHub
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Flutter SDK
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0' # Sesuaikan dengan versi Flutter Anda
          channel: 'stable'

      # 4. Ambil dependensi pub
      - name: Install Dependencies
        run: flutter pub get

      # 5. Build APK Release
      - name: Build APK
        run: flutter build apk --release

      # 6. Upload hasil APK sebagai Artefak agar bisa diunduh
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
